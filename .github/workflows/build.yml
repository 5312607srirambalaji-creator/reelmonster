name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip archive
        run: |
          if [ -f "ReelMonster-Android-Project.zip" ]; then
            unzip -o ReelMonster-Android-Project.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Compatible Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Fix Repository Conflict & Build APK
        run: |
          # Remove strict repository mode so build.gradle doesn't conflict
          sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g' settings.gradle 2>/dev/null || true
          sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g' */settings.gradle 2>/dev/null || true
          
          # Compile the APK
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ReelMonster-APK
          path: "**/build/outputs/apk/debug/*.apk"
